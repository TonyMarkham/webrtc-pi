[workspace]
# The GPUI companion app is a member so dependency versions and the lockfile
# stay unified, but it is excluded from the default build: it needs a desktop
# GPU toolchain and is meant to be built on a workstation, not on the Pi.
# Build it explicitly with `cargo build -p pi-control` (from the repo root or
# the `app/` directory).
members = ["app"]
default-members = ["."]

[package]
name = "webrtc-pi"
version = "0.1.0"
edition = "2024"
description = "WebRTC camera streaming server for Raspberry Pi 5"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
rand = "0.10"
rtc = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turbojpeg = "1"
webrtc = "0.21"
x264 = "0.5"

[profile.release]
lto = "thin"
