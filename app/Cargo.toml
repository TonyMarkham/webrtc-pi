[package]
name = "pi-control"
version = "0.1.0"
edition = "2024"
description = "Cross-platform GPUI companion app for the webrtc-pi camera server"

[[bin]]
name = "pi-control"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
